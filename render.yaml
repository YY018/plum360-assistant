# Render Blueprint: one free Docker web service that serves the site and API.
# Secrets marked "sync: false" are entered in the Render dashboard, never here.
services:
  - type: web
    name: plum360-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: EMBEDDING_PROVIDER
        value: local
      - key: APP_ENV
        value: production
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: DAILY_REQUEST_BUDGET
        value: "300"
      - key: MAX_QUESTION_CHARS
        value: "600"
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: DATA_REPO
        sync: false
      - key: DATA_REPO_TOKEN
        sync: false
